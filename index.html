<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Tunnel App - Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #2d3748;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .desc {
            font-size: 16px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .input-group label {
            font-size: 15px;
            color: #2d3748;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            color: #2d3748;
            outline: none;
        }

        .input-group input:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
        }

        code {
            background-color: #f7fafc;
            color: #4a5568;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: "SF Mono", Monaco, monospace;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .action-btn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #3182ce, #2c5282);
            transform: translateY(-2px);
        }

        .secondary-btn {
            background: linear-gradient(135deg, #718096, #4a5568);
            color: white;
        }

        .secondary-btn:hover {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        #status {
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #status:empty {
            background: transparent;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSH Tunnel App</h1>
        <p class="desc" id="setup-desc"></p>
        
        <!-- Local SSH Listen Port Input -->
        <div class="input-group">
            <label for="localPortInput">Local SSH Listen Port</label>
            <input type="number" id="localPortInput" min="1" max="65535" value="8008">
        </div>
        
        <div class="btn-group">
            <button id="selectKeyBtn" class="action-btn primary-btn">Select Private Key</button>
            <button id="loginBtn" class="action-btn primary-btn hidden">Login with Saved Key</button>
            <button id="reselectKeyBtn" class="action-btn secondary-btn hidden">Reselect Private Key</button>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        // DOM Element References
        const selectKeyBtn = document.getElementById('selectKeyBtn');
        const loginBtn = document.getElementById('loginBtn');
        const reselectKeyBtn = document.getElementById('reselectKeyBtn');
        const statusDiv = document.getElementById('status');
        const setupDesc = document.getElementById('setup-desc');
        const localPortInput = document.getElementById('localPortInput');

        // Initialize UI state on page load
        async function initUI() {
            const { hasSavedKey } = await window.electronAPI.getSavedKeyStatus();
            if (hasSavedKey) {
                selectKeyBtn.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                reselectKeyBtn.classList.remove('hidden');
                setupDesc.innerHTML = 'Private key saved. Click "Login" to connect, or reselect a new key.';
            } else {
                selectKeyBtn.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                reselectKeyBtn.classList.add('hidden');
                setupDesc.innerHTML = 'First time setup: Please select your <code>id_rsa</code> private key file.';
            }
        }

        // Page load initialization
        window.addEventListener('DOMContentLoaded', initUI);

        // Update status message with color styling
        function updateStatus(text, isSuccess = false) {
            statusDiv.textContent = text;
            statusDiv.style.color = isSuccess ? '#22543d' : '#742a2a';
            statusDiv.style.backgroundColor = isSuccess ? '#c6f6d5' : '#fed7d7';
        }

        // Validate port number (1-65535)
        function validatePort(port) {
            const portNum = parseInt(port, 10);
            if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                updateStatus('Error: Please enter a valid port (1-65535)', false);
                return false;
            }
            return portNum;
        }

        // Handle private key selection and login
        async function handleSelectKey() {
            const port = validatePort(localPortInput.value.trim());
            if (!port) return;

            updateStatus('Opening file selector...');
            try {
                const result = await window.electronAPI.selectPrivateKey(port);
                if (result.success) {
                    updateStatus(result.message, true);
                } else {
                    updateStatus(`Error: ${result.message}`);
                }
            } catch (err) {
                updateStatus(`Error: ${err.message}`);
            }
        }

        // Handle login with saved private key
        async function handleLogin() {
            const port = validatePort(localPortInput.value.trim());
            if (!port) return;

            updateStatus('Connecting with saved key...');
            try {
                const result = await window.electronAPI.loginWithSavedKey(port);
                if (result.success) {
                    updateStatus(result.message, true);
                } else {
                    updateStatus(`Error: ${result.message}`);
                }
            } catch (err) {
                updateStatus(`Connection error: ${err.message}`);
            }
        }

        // Clear saved key and reselect
        async function handleReselectKey() {
            updateStatus('Clearing saved key...');
            await window.electronAPI.clearPrivateKey();
            await initUI();
            updateStatus('Please select a new private key');
            handleSelectKey();
        }

        // Bind button click events
        selectKeyBtn.addEventListener('click', handleSelectKey);
        loginBtn.addEventListener('click', handleLogin);
        reselectKeyBtn.addEventListener('click', handleReselectKey);
    </script>
</body>
</html>
