<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Tunnel App - Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #2d3748;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .desc {
            font-size: 16px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        code {
            background-color: #f7fafc;
            color: #4a5568;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: "SF Mono", Monaco, monospace;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .action-btn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #3182ce, #2c5282);
            transform: translateY(-2px);
        }

        .secondary-btn {
            background: linear-gradient(135deg, #718096, #4a5568);
            color: white;
        }

        .secondary-btn:hover {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        #status {
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #status:empty {
            background: transparent;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSH Tunnel App</h1>
        <p class="desc" id="setup-desc"></p>
        
        <div class="btn-group">
            <button id="selectKeyBtn" class="action-btn primary-btn">Select Private Key</button>
            <button id="loginBtn" class="action-btn primary-btn hidden">Login with Saved Key</button>
            <button id="reselectKeyBtn" class="action-btn secondary-btn hidden">Reselect Private Key</button>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        const selectKeyBtn = document.getElementById('selectKeyBtn');
        const loginBtn = document.getElementById('loginBtn');
        const reselectKeyBtn = document.getElementById('reselectKeyBtn');
        const statusDiv = document.getElementById('status');
        const setupDesc = document.getElementById('setup-desc');

        // 初始化：刷新UI状态（根据是否有密钥显示按钮）
        async function initUI() {
            const { hasSavedKey } = await window.electronAPI.getSavedKeyStatus();
            if (hasSavedKey) {
                selectKeyBtn.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                reselectKeyBtn.classList.remove('hidden');
                setupDesc.innerHTML = 'Private key saved. Click "Login" to connect, or reselect a new key.';
            } else {
                selectKeyBtn.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                reselectKeyBtn.classList.add('hidden');
                setupDesc.innerHTML = 'First time setup: Please select your <code>id_rsa</code> private key file.';
            }
        }

        // 页面加载初始化
        window.addEventListener('DOMContentLoaded', initUI);

        // 统一状态提示
        function updateStatus(text, isSuccess = false) {
            statusDiv.textContent = text;
            statusDiv.style.color = isSuccess ? '#22543d' : '#742a2a';
            statusDiv.style.backgroundColor = isSuccess ? '#c6f6d5' : '#fed7d7';
        }

        // 1. 选择密钥逻辑
        async function handleSelectKey() {
            updateStatus('Opening file selector...');
            try {
                const result = await window.electronAPI.selectPrivateKey();
                if (result.success) {
                    updateStatus(result.message, true);
                } else {
                    // 失败：显示错误，不关闭窗口
                    updateStatus(`Login failed: ${result.message}`);
                }
            } catch (err) {
                updateStatus(`Error: ${err.message}`);
            }
        }

        // 2. 登录逻辑（使用保存的密钥）
        async function handleLogin() {
            updateStatus('Connecting with saved key...');
            try {
                const result = await window.electronAPI.loginWithSavedKey();
                if (result.success) {
                    updateStatus(result.message, true);
                } else {
                    // 失败：显示错误，保留窗口
                    updateStatus(`Login failed: ${result.message}`);
                }
            } catch (err) {
                updateStatus(`Connection error: ${err.message}`);
            }
        }

        // 3. 重新选择密钥（核心修改：清除已保存的路径）
        async function handleReselectKey() {
            updateStatus('Clearing saved key...');
            // 第一步：清除主进程保存的密钥配置
            await window.electronAPI.clearPrivateKey();
            // 第二步：重置UI为「首次选择」状态
            await initUI();
            updateStatus('Please select a new private key');
            // 第三步：打开文件选择器
            handleSelectKey();
        }

        // 绑定按钮事件
        selectKeyBtn.addEventListener('click', handleSelectKey);
        loginBtn.addEventListener('click', handleLogin);
        reselectKeyBtn.addEventListener('click', handleReselectKey);
    </script>
</body>
</html>
