<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Tunnel App - Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4285F4;
            --primary-dark: #3367D6;
            --secondary: #5F6368;
            --danger: #EA4335;
            --success: #34A853;
            --light-bg: #F8F9FA;
            --card-bg: #ffffff;
            --border: #DADCE0;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            background: linear-gradient(135deg, #E4EAF2 0%, #F5F7FA 100%);
            padding: 10px 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 540px;
            padding: 20px 18px 6px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 24px;
            color: #202124;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .desc {
            font-size: 14px;
            color: var(--secondary);
            line-height: 1.4;
            margin-bottom: 20px;
        }

        /* Configuration Card */
        .config-manager {
            margin: 0 0 14px 0;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: var(--light-bg);
            transition: all 0.2s ease;
        }

        .config-manager:hover {
            box-shadow: var(--shadow);
        }
        
        .config-manager h3 {
            font-size: 16px;
            color: #202124;
            margin-bottom: 8px;
            text-align: left;
            font-weight: 600;
            font-size: 15px;
        }
        
        .config-select-group {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }
        
        #configSelect {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: #202124;
            outline: none;
            transition: all 0.2s ease;
            background: white;
        }
        
        #configSelect:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.15);
        }
        
        #deleteConfigBtn {
            padding: 0 16px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        #deleteConfigBtn:hover {
            background: #D93025;
            transform: translateY(-1px);
        }
        
        .config-save-group {
            display: flex;
            gap: 12px;
        }
        
        #configNameInput {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        /* Form Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .input-group label {
            font-size: 12px;
            color: #5F6368;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: #202124;
            outline: none;
            transition: all 0.2s ease;
            background: white;
        }

        .input-group input:hover {
            border-color: #BDC1C6;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.15);
        }

        /* Button Group */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .action-btn {
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.25s ease;
            min-width: 120px;
        }

        .primary-btn {
            background: var(--primary);
            color: white;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(66, 133, 244, 0.25);
        }

        .secondary-btn {
            background: var(--secondary);
            color: white;
        }

        .secondary-btn:hover {
            background: #4A4F54;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(95, 99, 104, 0.2);
        }

        #saveConfigBtn {
            padding: 10px 22px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        #saveConfigBtn:hover {
            background: #2D8F46;
            transform: translateY(-1px);
        }

        .hidden {
            display: none !important;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            min-width: 280px;
            max-width: 420px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        #toast.error {
            background: linear-gradient(135deg, #EA4335, #C5221F);
        }

        #toast.success {
            background: linear-gradient(135deg, #34A853, #1E8E3E);
        }

        #toast.info {
            background: linear-gradient(135deg, #4285F4, #1557B0);
        }

        #toast .toast-icon {
            font-size: 16px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSH Tunnel App</h1>
        <p class="desc" id="setup-desc"></p>
        
        <div class="config-manager">
            <h3>Configuration Management</h3>
            <div class="config-select-group">
                <select id="configSelect">
                    <option value="">Select saved configuration</option>
                </select>
                <button id="deleteConfigBtn">Delete</button>
            </div>
            <div class="config-save-group">
                <input type="text" id="configNameInput" placeholder="Config name (e.g. Office)">
                <button id="saveConfigBtn">Save Config</button>
            </div>
        </div>
        
        <div class="form-grid">
            <div class="input-group">
                <label for="remoteSshIpInput">Remote SSH IP / Host</label>
                <input type="text" id="remoteSshIpInput" value="192.168.1.100" placeholder="e.g. 192.168.1.100 or server.example.com">
            </div>
            <div class="input-group">
                <label for="remoteSshUsernameInput">SSH Username</label>
                <input type="text" id="remoteSshUsernameInput" value="root" placeholder="e.g. root">
            </div>
            <div class="input-group">
                <label for="remoteSshPortInput">SSH Port</label>
                <input type="number" id="remoteSshPortInput" min="1" max="65535" value="22">
            </div>
            <div class="input-group">
                <label for="forwardTargetPortInput">Target Port</label>
                <input type="number" id="forwardTargetPortInput" min="1" max="65535" value="8008">
            </div>
            <div class="input-group">
                <label for="localPortInput">Local Port</label>
                <input type="number" id="localPortInput" min="1" max="65535" value="8008">
            </div>
            <div class="input-group">
                <label for="targetUrlInput">Target URL</label>
                <input type="text" id="targetUrlInput" value="http://127.0.0.1:8008" placeholder="e.g. http://127.0.0.1:8008">
            </div>
        </div>
        
        <div class="btn-group">
            <button id="selectKeyBtn" class="action-btn primary-btn">Select Private Key</button>
            <button id="loginBtn" class="action-btn primary-btn hidden">Login</button>
            <button id="reselectKeyBtn" class="action-btn secondary-btn hidden">Reselect Key</button>
        </div>
    </div>

    <div id="toast"></div>

<script>
        // DOM Elements
        const remoteSshIpInput = document.getElementById('remoteSshIpInput');
        const remoteSshUsernameInput = document.getElementById('remoteSshUsernameInput');
        const remoteSshPortInput = document.getElementById('remoteSshPortInput');
        const forwardTargetPortInput = document.getElementById('forwardTargetPortInput');
        const localPortInput = document.getElementById('localPortInput');
        const targetUrlInput = document.getElementById('targetUrlInput');
        const configSelect = document.getElementById('configSelect');
        const configNameInput = document.getElementById('configNameInput');
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        const deleteConfigBtn = document.getElementById('deleteConfigBtn');

        const selectKeyBtn = document.getElementById('selectKeyBtn');
        const loginBtn = document.getElementById('loginBtn');
        const reselectKeyBtn = document.getElementById('reselectKeyBtn');
        const toastEl = document.getElementById('toast');
        const setupDesc = document.getElementById('setup-desc');

        // Initialize UI: load config, key status and saved configurations
        async function initUI() {
            const defaultConfig = await window.electronAPI.getDefaultConfig();
            remoteSshIpInput.value = defaultConfig.remoteSshIp;
            remoteSshUsernameInput.value = defaultConfig.remoteSshUsername;
            remoteSshPortInput.value = defaultConfig.remoteSshPort;
            forwardTargetPortInput.value = defaultConfig.forwardTargetPort;
            localPortInput.value = defaultConfig.localListenPort;
            targetUrlInput.value = defaultConfig.targetUrl || `http://127.0.0.1:${defaultConfig.localListenPort}`;

            const { hasSavedKey } = await window.electronAPI.getSavedKeyStatus();
            if (hasSavedKey) {
                selectKeyBtn.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                reselectKeyBtn.classList.remove('hidden');
                setupDesc.textContent = 'Private key saved. Click "Login" to connect.';
            } else {
                selectKeyBtn.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                reselectKeyBtn.classList.add('hidden');
                setupDesc.textContent = 'Please select your id_rsa private key file.';
            }

            await loadConfigList();
            bindPortSync(); // Bind port synchronization function
        }

        // Core: Two-way sync between Local Port and Target URL port
        function bindPortSync() {
            // Sync Local Port changes to URL
            localPortInput.addEventListener('input', () => {
                const port = localPortInput.value.trim();
                if (!port) return;
                targetUrlInput.value = `http://127.0.0.1:${port}`;
            });

            // Sync URL port changes to Local Port
            targetUrlInput.addEventListener('input', () => {
                const url = targetUrlInput.value.trim();
                const match = url.match(/:(\d+)$/);
                if (match && match[1]) {
                    localPortInput.value = match[1];
                }
            });
        }

        // Load saved configuration list to dropdown
        async function loadConfigList() {
            const configList = await window.electronAPI.getConfigList();
            const lastSelection = await window.electronAPI.getAppState();
            configSelect.innerHTML = '<option value="">Select saved configuration</option>';
            configList.forEach(config => {
                const option = document.createElement('option');
                option.value = config.name;
                option.textContent = config.name;
                configSelect.appendChild(option);
            });
            // Restore last selection if it still exists in the list
            if (lastSelection.lastConfigName) {
                const option = configSelect.querySelector(`option[value="${lastSelection.lastConfigName}"]`);
                if (option) configSelect.value = lastSelection.lastConfigName;
            }
        }

        let toastTimer = null;
        function showToast(message, type = 'error') {
            if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
            const icons = { error: '✖', success: '✔', info: 'ℹ' };
            toastEl.className = type;
            toastEl.innerHTML = '<span class="toast-icon">' + (icons[type] || '') + '</span> ' + message;
            requestAnimationFrame(() => {
                toastEl.classList.add('show');
            });
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
                toastTimer = null;
            }, 3000);
        }

        // Validate IPv4 address or hostname (domain name) format
        function validateIp(ip) {
            const ipRegex = /^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            if (ipRegex.test(ip)) return ip;
            // Also allow hostname (domain name), e.g. server.example.com
            const hostRegex = /^[a-zA-Z0-9]([a-zA-Z0-9\-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9\-]*[a-zA-Z0-9])?)*$/;
            if (hostRegex.test(ip)) return ip;
            showToast('Invalid address (IP or hostname)');
            return false;
        }

        // Validate SSH username (not empty)
        function validateUsername(input) {
            const username = input.value.trim();
            if (!username) {
                showToast('SSH username cannot be empty');
                return false;
            }
            return username;
        }

        // Validate port number (1-65535)
        function validatePort(input) {
            const port = parseInt(input.value.trim(), 10);
            if (isNaN(port) || port < 1 || port > 65535) {
                showToast('Invalid port number (1-65535)');
                return false;
            }
            return port;
        }

        // Validate URL format
        function validateUrl(url) {
            if (!url.trim()) {
                showToast('Target URL cannot be empty');
                return false;
            }
            try {
                new URL(url);
                return url;
            } catch (e) {
                showToast('Invalid URL format');
                return false;
            }
        }

        // Get and validate all form data
        function getValidatedConfig() {
            const config = {
                remoteSshIp: validateIp(remoteSshIpInput.value.trim()),
                remoteSshUsername: validateUsername(remoteSshUsernameInput),
                remoteSshPort: validatePort(remoteSshPortInput),
                forwardTargetPort: validatePort(forwardTargetPortInput),
                localListenPort: validatePort(localPortInput),
                targetUrl: validateUrl(targetUrlInput.value.trim())
            };
            if (!config.remoteSshIp || !config.remoteSshUsername || !config.remoteSshPort || !config.forwardTargetPort || !config.localListenPort || !config.targetUrl) {
                return null;
            }
            return config;
        }

        // Save current configuration to file
        async function handleSaveConfig() {
            const configName = configNameInput.value.trim();
            if (!configName) {
                showToast('Config name cannot be empty');
                return;
            }
            const config = getValidatedConfig();
            if (!config) return;

            try {
                await window.electronAPI.saveNamedConfig(configName, config);
                showToast('Config saved', 'success');
                configNameInput.value = '';
                await loadConfigList();
            } catch (err) {
                showToast(err.message);
            }
        }

        // Load selected configuration
        async function handleConfigSelect() {
            const configName = configSelect.value;
            // Persist the selection so it survives app restart
            await window.electronAPI.saveAppState({ lastConfigName: configName });
            if (!configName) return;

            try {
                const config = await window.electronAPI.loadNamedConfig(configName);
                remoteSshIpInput.value = config.remoteSshIp;
                remoteSshUsernameInput.value = config.remoteSshUsername;
                remoteSshPortInput.value = config.remoteSshPort;
                forwardTargetPortInput.value = config.forwardTargetPort;
                localPortInput.value = config.localListenPort;
                targetUrlInput.value = config.targetUrl;
            } catch (err) {
                showToast(err.message);
            }
        }

        // Delete selected configuration
        async function handleDeleteConfig() {
            const configName = configSelect.value;
            if (!configName) {
                showToast('Please select a config to delete');
                return;
            }

            try {
                await window.electronAPI.deleteNamedConfig(configName);
                showToast('Config deleted', 'success');
                await loadConfigList();
                remoteSshIpInput.value = '';
                remoteSshUsernameInput.value = '';
                remoteSshPortInput.value = '';
                forwardTargetPortInput.value = '';
                localPortInput.value = '';
                targetUrlInput.value = '';
            } catch (err) {
                showToast(err.message);
            }
        }

        // Select private key: only save key, do NOT login automatically
        async function handleSelectKey() {
            const config = getValidatedConfig();
            if (!config) return;
            showToast('Selecting private key...', 'info');
            try {
                const res = await window.electronAPI.selectPrivateKey(config);
                if (res.success) {
                    showToast('Private key saved. Click Login to connect', 'success');
                    await initUI();
                } else {
                    showToast(res.message);
                }
            } catch (err) {
                showToast(err.message);
            }
        }

        // Manual login: establish SSH tunnel and open URL
        async function handleLogin() {
            const config = getValidatedConfig();
            if (!config) return;
            showToast('Connecting SSH tunnel...', 'info');
            try {
                const res = await window.electronAPI.loginWithSavedKey(config);
                if (res.success) {
                    showToast('SSH tunnel established', 'success');
                } else {
                    showToast(res.message);
                }
            } catch (err) {
                showToast(err.message);
            }
        }

        // Clear saved private key
        async function handleReselectKey() {
            showToast('Clearing saved key...', 'info');
            await window.electronAPI.clearPrivateKey();
            await initUI();
        }

        // Bind event listeners
        window.addEventListener('DOMContentLoaded', initUI);
        selectKeyBtn.addEventListener('click', handleSelectKey);
        loginBtn.addEventListener('click', handleLogin);
        reselectKeyBtn.addEventListener('click', handleReselectKey);
        saveConfigBtn.addEventListener('click', handleSaveConfig);
        configSelect.addEventListener('change', handleConfigSelect);
        deleteConfigBtn.addEventListener('click', handleDeleteConfig);
    </script>
</body>
</html>
