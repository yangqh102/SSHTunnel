<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Tunnel App - Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            padding: 20px;
        }

        /* 主卡片容器 */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        /* 标题样式 */
        h1 {
            font-size: 26px;
            color: #2d3748;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* 描述文本 */
        .desc {
            font-size: 16px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* 代码高亮 */
        code {
            background-color: #f7fafc;
            color: #4a5568;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: "SF Mono", Monaco, monospace;
            font-size: 15px;
        }

        /* 主按钮 */
        #selectKeyBtn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 280px;
        }

        #selectKeyBtn:hover {
            background: linear-gradient(135deg, #3182ce, #2c5282);
            transform: translateY(-2px);
        }

        #selectKeyBtn:active {
            transform: translateY(0);
        }

        /* 状态提示框 */
        #status {
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* 状态默认颜色 */
        #status:empty {
            background: transparent;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSH Tunnel App</h1>
        <p class="desc">First time setup: Please select your <code>id_rsa</code> private key file.</p>
        
        <button id="selectKeyBtn">Select Private Key</button>
        <div id="status"></div>
    </div>

    <script>
        const selectKeyBtn = document.getElementById('selectKeyBtn');
        const statusDiv = document.getElementById('status');

        selectKeyBtn.addEventListener('click', async () => {
            statusDiv.textContent = 'Opening file selector...';
            statusDiv.style.color = '#4a5568';
            statusDiv.style.backgroundColor = '#f7fafc';
            
            const result = await window.electronAPI.selectPrivateKey();
            if (result.success) {
                statusDiv.textContent = result.message;
                statusDiv.style.color = '#22543d';
                statusDiv.style.backgroundColor = '#c6f6d5';
                setTimeout(() => {
                    statusDiv.textContent = 'Setup successful, window closing...';
                }, 1000);
            } else {
                statusDiv.textContent = result.message;
                statusDiv.style.color = '#742a2a';
                statusDiv.style.backgroundColor = '#fed7d7';
            }
        });
    </script>
</body>
</html>
