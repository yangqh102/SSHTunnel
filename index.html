<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Tunnel App - Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #2d3748;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .desc {
            font-size: 16px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .input-group label {
            font-size: 15px;
            color: #2d3748;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            color: #2d3748;
            outline: none;
        }

        .input-group input:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .action-btn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.2s ease;
            min-width: 180px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #3182ce, #2c5282);
            transform: translateY(-2px);
        }

        .secondary-btn {
            background: linear-gradient(135deg, #718096, #4a5568);
            color: white;
        }

        .hidden {
            display: none !important;
        }

        #status {
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSH Tunnel App</h1>
        <p class="desc" id="setup-desc"></p>
        
        <div class="input-group">
            <label for="remoteSshIpInput">Remote SSH Server IP</label>
            <input type="text" id="remoteSshIpInput" value="222.212.86.164" placeholder="e.g. 192.168.1.100">
        </div>
        
        <div class="input-group">
            <label for="remoteSshUsernameInput">Remote SSH Username</label>
            <input type="text" id="remoteSshUsernameInput" value="dell" placeholder="e.g. root">
        </div>

        <div class="input-group">
            <label for="remoteSshPortInput">Remote SSH Server Port</label>
            <input type="number" id="remoteSshPortInput" min="1" max="65535" value="10007">
        </div>
        
        <div class="input-group">
            <label for="forwardTargetPortInput">Forward Target Port</label>
            <input type="number" id="forwardTargetPortInput" min="1" max="65535" value="8008">
        </div>
        
        <div class="input-group">
            <label for="localPortInput">Local Listen Port</label>
            <input type="number" id="localPortInput" min="1" max="65535" value="8008">
        </div>
        
        <div class="btn-group">
            <button id="selectKeyBtn" class="action-btn primary-btn">Select Private Key</button>
            <button id="loginBtn" class="action-btn primary-btn hidden">Login with Saved Key</button>
            <button id="reselectKeyBtn" class="action-btn secondary-btn hidden">Reselect Private Key</button>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        const selectKeyBtn = document.getElementById('selectKeyBtn');
        const loginBtn = document.getElementById('loginBtn');
        const reselectKeyBtn = document.getElementById('reselectKeyBtn');
        const statusDiv = document.getElementById('status');
        const setupDesc = document.getElementById('setup-desc');
        
        const remoteSshIpInput = document.getElementById('remoteSshIpInput');
        // 新增：获取用户名输入框
        const remoteSshUsernameInput = document.getElementById('remoteSshUsernameInput');
        const remoteSshPortInput = document.getElementById('remoteSshPortInput');
        const forwardTargetPortInput = document.getElementById('forwardTargetPortInput');
        const localPortInput = document.getElementById('localPortInput');

        async function initUI() {
            const { hasSavedKey } = await window.electronAPI.getSavedKeyStatus();
            if (hasSavedKey) {
                selectKeyBtn.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                reselectKeyBtn.classList.remove('hidden');
                setupDesc.textContent = 'Private key saved. Click "Login" to connect, or reselect a new key.';
            } else {
                selectKeyBtn.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                reselectKeyBtn.classList.add('hidden');
                setupDesc.textContent = 'Please select your id_rsa private key file.';
            }
        }

        function updateStatus(text, isSuccess = false) {
            statusDiv.textContent = text;
            statusDiv.style.color = isSuccess ? '#22543d' : '#742a2a';
            statusDiv.style.backgroundColor = isSuccess ? '#c6f6d5' : '#fed7d7';
        }

        function validateIp(ip) {
            const ipRegex = /^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            if (!ipRegex.test(ip)) {
                updateStatus('Error: Invalid IPv4 address');
                return false;
            }
            return ip;
        }

        // 新增：用户名验证逻辑
        function validateUsername(input) {
            const username = input.value.trim();
            if (!username) {
                updateStatus('Error: SSH username cannot be empty');
                return false;
            }
            return username;
        }

        function validatePort(input) {
            const port = parseInt(input.value.trim(), 10);
            if (isNaN(port) || port < 1 || port > 65535) {
                updateStatus(`Error: Invalid port (1-65535)`);
                return false;
            }
            return port;
        }

        function getValidatedConfig() {
            const config = {
                remoteSshIp: validateIp(remoteSshIpInput.value.trim()),
                // 新增：加入用户名验证
                remoteSshUsername: validateUsername(remoteSshUsernameInput),
                remoteSshPort: validatePort(remoteSshPortInput),
                forwardTargetPort: validatePort(forwardTargetPortInput),
                localListenPort: validatePort(localPortInput)
            };
            // 校验所有必填项
            if (!config.remoteSshIp || !config.remoteSshUsername || !config.remoteSshPort || !config.forwardTargetPort || !config.localListenPort) {
                return null;
            }
            return config;
        }

        async function handleSelectKey() {
            const config = getValidatedConfig();
            if (!config) return;
            updateStatus('Opening file selector...');
            try {
                const res = await window.electronAPI.selectPrivateKey(config);
                res.success ? updateStatus(res.message, true) : updateStatus(`Error: ${res.message}`);
            } catch (err) { updateStatus(`Error: ${err.message}`); }
        }

        async function handleLogin() {
            const config = getValidatedConfig();
            if (!config) return;
            updateStatus('Connecting...');
            try {
                const res = await window.electronAPI.loginWithSavedKey(config);
                res.success ? updateStatus(res.message, true) : updateStatus(`Error: ${res.message}`);
            } catch (err) { updateStatus(`Error: ${err.message}`); }
        }

        async function handleReselectKey() {
            updateStatus('Clearing key...');
            await window.electronAPI.clearPrivateKey();
            await initUI();
            handleSelectKey();
        }

        window.addEventListener('DOMContentLoaded', initUI);
        selectKeyBtn.addEventListener('click', handleSelectKey);
        loginBtn.addEventListener('click', handleLogin);
        reselectKeyBtn.addEventListener('click', handleReselectKey);
    </script>
</body>
</html>
