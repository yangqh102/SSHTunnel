name: Build macOS Electron App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: '' # 禁用缓存避免干扰

      # 步骤1：修复权限 + 清理旧依赖
      - name: Fix Permissions & Clean Cache
        run: |
          sudo chown -R $USER:$GROUP ~/.npm
          sudo chown -R $USER:$GROUP /Users/runner/work
          npm cache clean --force
          rm -rf node_modules
          rm -f package-lock.json yarn.lock

      # 步骤2：安装编译环境（核心修复node-gyp路径问题）
      - name: Install Build Tools (Fix node-gyp PATH)
        run: |
          # 1. 安装Xcode命令行工具
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcode-select --install || true

          # 2. 安装Python3.10和openssl
          brew install python@3.10 openssl
          export PYTHON=$(which python3.10)
          export PATH="$PYTHON:$PATH"

          # 3. 安装node-gyp并配置PATH（关键！）
          # 获取npm全局安装路径
          NPM_GLOBAL_PATH=$(npm config get prefix)/bin
          # 将npm全局路径加入系统PATH（让终端找到node-gyp）
          export PATH="$NPM_GLOBAL_PATH:$PATH"
          # 全局安装node-gyp
          npm install --global node-gyp@latest
          
          # 验证node-gyp是否安装成功（必做）
          if command -v node-gyp &> /dev/null; then
            echo "✅ node-gyp 安装成功，路径：$(which node-gyp)"
            node-gyp --version # 打印版本，确认可用
          else
            echo "❌ node-gyp 安装失败，未找到命令"
            # 打印npm全局路径，排查问题
            echo "npm全局路径：$NPM_GLOBAL_PATH"
            ls -la $NPM_GLOBAL_PATH # 查看是否有node-gyp可执行文件
            exit 1
          fi

          # 4. 配置node-gyp使用正确的Python
          node-gyp configure --python="$PYTHON"

      # 步骤3：重新安装项目依赖
      - name: Install Dependencies
        run: |
          # 屏蔽funding提示，强制安装
          npm install --force --verbose --no-cache --no-fund
          # 验证ssh2安装
          if [ -f "node_modules/ssh2/package.json" ]; then
            echo "✅ ssh2 依赖安装成功"
          else
            echo "❌ ssh2 依赖安装失败"
            ls -la node_modules/
            exit 1
          fi

      # 步骤4：重建ssh2原生模块
      - name: Rebuild ssh2 for Electron
        run: |
          # 确保PATH包含node-gyp
          NPM_GLOBAL_PATH=$(npm config get prefix)/bin
          export PATH="$NPM_GLOBAL_PATH:$PATH"
          
          npm install --save-dev electron-rebuild
          # 显式指定Python路径重建
          PYTHON=$(which python3.10) npx electron-rebuild -f -m ssh2 --electron-version=28.0.0 --verbose
          
          # 验证编译结果
          if [ -f "node_modules/ssh2/lib/binding/napi-v6-darwin-x64/ssh2.node" ] || [ -f "node_modules/ssh2/lib/binding/napi-v6-darwin-arm64/ssh2.node" ]; then
            echo "✅ ssh2 原生模块编译成功"
          else
            echo "❌ ssh2 原生模块编译失败"
            ls -la node_modules/ssh2/lib/binding/
            exit 1
          fi

      # 步骤5：打包macOS应用
      - name: Build macOS App
        run: |
          # 再次确保PATH包含node-gyp（打包时可能需要）
          NPM_GLOBAL_PATH=$(npm config get prefix)/bin
          export PATH="$NPM_GLOBAL_PATH:$PATH"
          npm run build:mac --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON: $(which python3.10)

      # 步骤6：上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac/
          retention-days: 30