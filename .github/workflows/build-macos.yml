name: Build macOS Electron App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          # 关键：禁用缓存（避免损坏的ssh2缓存），测试通过后可恢复
          cache-dependency-path: '' 

      # 步骤1：修复macOS权限 & 清理旧缓存
      - name: Fix macOS Permissions & Clean Cache
        run: |
          # 重置npm权限，避免安装失败
          sudo chown -R $USER:$GROUP ~/.npm
          sudo chown -R $USER:$GROUP /Users/runner/work
          # 清理npm缓存和node_modules
          npm cache clean --force
          rm -rf node_modules
          rm -f package-lock.json yarn.lock

      # 步骤2：安装完整的macOS编译环境
      - name: Install Full Build Tools
        run: |
          # 强制安装Xcode命令行工具（忽略已安装提示）
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcode-select --install || true
          # 安装依赖工具
          brew install python3 openssl
          npm install --global node-gyp@latest
          # 配置node-gyp使用正确的Python
          npm config set python $(which python3)
          npm config set openssl_root_dir $(brew --prefix openssl)

      # 步骤3：重新安装依赖（带详细日志，确保ssh2安装成功）
      - name: Reinstall Dependencies (Force Fresh)
        run: |
          # 强制重新安装所有依赖，跳过缓存
          npm install --force --verbose --no-cache
          # 关键验证：检查ssh2是否安装成功（存在package.json）
          if [ -f "node_modules/ssh2/package.json" ]; then
            echo "✅ ssh2 依赖安装成功，package.json 存在"
            # 打印ssh2路径，确认位置
            ls -la node_modules/ssh2/
          else
            echo "❌ ssh2 依赖安装失败，缺失package.json"
            # 打印node_modules目录，排查问题
            ls -la node_modules/
            exit 1
          fi

      # 步骤4：重建ssh2（仅在确认安装成功后执行）
      - name: Rebuild ssh2 for Electron (macOS)
        run: |
          npm install --save-dev electron-rebuild
          # 显式指定Electron版本重建，避免版本匹配错误
          npx electron-rebuild -f -m ssh2 --electron-version=28.0.0 --verbose
          # 验证编译后的二进制文件
          if [ -f "node_modules/ssh2/lib/binding/napi-v6-darwin-x64/ssh2.node" ]; then
            echo "✅ ssh2 原生模块编译成功（macOS x64）"
          elif [ -f "node_modules/ssh2/lib/binding/napi-v6-darwin-arm64/ssh2.node" ]; then
            echo "✅ ssh2 原生模块编译成功（macOS arm64）"
          else
            echo "❌ ssh2 原生模块编译失败，二进制文件缺失"
            ls -la node_modules/ssh2/lib/binding/
            exit 1
          fi

      # 步骤5：打包macOS应用
      - name: Build macOS App
        run: npm run build:mac --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}
          # 临时禁用asar（测试用，排查打包路径问题）
          ELECTRON_BUILDER_ASAR: false

      # 步骤6：上传产物
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac/
          retention-days: 30