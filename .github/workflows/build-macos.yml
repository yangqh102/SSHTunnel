name: Build macOS Electron App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      # 全局环境变量：指定arm64架构的依赖路径
      ARCH: arm64
      OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3
      OPENSSL_LIB_DIR: /opt/homebrew/opt/openssl@3/lib
      OPENSSL_INCLUDE_DIR: /opt/homebrew/opt/openssl@3/include
      PYTHON: /opt/homebrew/bin/python3.10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (18.x, arm64)
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          architecture: arm64 # 显式指定arm64架构
          cache: 'npm'
          cache-dependency-path: ''

      # 步骤1：彻底清理旧依赖和缓存
      - name: Clean Up Environment
        run: |
          sudo rm -rf /Users/runner/work/_temp/*
          npm cache clean --force
          rm -rf node_modules package-lock.json yarn.lock
          # 重置Xcode工具链
          sudo xcode-select -r
          xcode-select --print-path

      # 步骤2：安装完整的编译环境（适配arm64）
      - name: Install Full Build Dependencies (arm64)
        run: |
          # 1. 安装Xcode命令行工具（强制重装）
          sudo rm -rf /Library/Developer/CommandLineTools
          xcode-select --install || true
          # 验证Xcode工具
          xcrun --show-sdk-path
          
          # 2. 安装brew依赖（arm64版本）
          brew install python@3.10 openssl@3
          
          # 3. 降级node-gyp到兼容版本（v9.x适配Node.js 18）
          NPM_GLOBAL_PATH=$(npm config get prefix)/bin
          export PATH="$NPM_GLOBAL_PATH:$PATH"
          npm uninstall --global node-gyp
          npm install --global node-gyp@9.4.0 # 兼容版本
          
          # 验证node-gyp和Python
          echo "node-gyp版本：$(node-gyp --version)"
          echo "Python路径：$PYTHON"
          $PYTHON --version
          
          # 4. 配置pkg-config（帮助找到OpenSSL）
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          echo "PKG_CONFIG_PATH：$PKG_CONFIG_PATH"

      # 步骤3：安装项目依赖（跳过node-gyp手动configure）
      - name: Install Dependencies (Skip Manual GYP)
        run: |
          # 禁用node-gyp手动configure，让npm自动处理
          npm config set node_gyp "$(npm root -g)/node-gyp/bin/node-gyp.js"
          # 安装依赖，强制arm64架构
          npm install --force --verbose --no-fund --arch=$ARCH \
            --openssl-root-dir=$OPENSSL_ROOT_DIR \
            --python=$PYTHON

          # 验证ssh2安装
          if [ -d "node_modules/ssh2" ]; then
            echo "✅ ssh2 依赖安装成功"
            ls -la node_modules/ssh2/
          else
            echo "❌ ssh2 依赖安装失败"
            exit 1
          fi

      # 步骤4：用electron-rebuild重建ssh2（自动适配Electron+arm64）
      - name: Rebuild ssh2 for Electron (arm64)
        run: |
          # 配置环境变量确保重建时找到依赖
          export PATH="$(npm config get prefix)/bin:$PATH"
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          npm install --save-dev electron-rebuild
          # 自动重建，无需手动指定python/openssl
          npx electron-rebuild -f -m ssh2 --electron-version=28.0.0 --arch=$ARCH --verbose
          
          # 验证编译结果
          BINDING_DIR="node_modules/ssh2/lib/binding/napi-v6-darwin-$ARCH"
          if [ -f "$BINDING_DIR/ssh2.node" ]; then
            echo "✅ ssh2 原生模块编译成功（$ARCH）"
            ls -la $BINDING_DIR/
          else
            echo "❌ ssh2 原生模块编译失败"
            ls -la node_modules/ssh2/lib/binding/
            exit 1
          fi

      # 步骤5：打包macOS应用（arm64）
      - name: Build macOS App (arm64)
        run: |
          export PATH="$(npm config get prefix)/bin:$PATH"
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          # 打包时指定arm64架构，跳过公证
          npm run build:mac -- --arch=$ARCH --skip-notarization --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true # 跳过依赖检查

      # 步骤6：上传产物
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-app-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac/
          retention-days: 30