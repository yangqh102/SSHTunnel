name: Build macOS Electron App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: '' # 禁用缓存，避免干扰

      # 步骤1：修复macOS权限 + 清理旧依赖/缓存
      - name: Fix Permissions & Clean Cache
        run: |
          sudo chown -R $USER:$GROUP ~/.npm
          sudo chown -R $USER:$GROUP /Users/runner/work
          npm cache clean --force
          rm -rf node_modules
          rm -f package-lock.json yarn.lock

      # 步骤2：安装编译环境（修正Python配置方式）
      - name: Install Build Tools (Fixed Python Config)
        run: |
          # 安装Xcode命令行工具
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcode-select --install || true
          # 安装Python3（固定版本，避免兼容问题）
          brew install python@3.10 openssl
          # 配置node-gyp（核心修复：不用npm config，改用环境变量/PATH）
          export PYTHON=$(which python3.10)
          export PATH="$PYTHON:$PATH"
          # 告诉node-gyp使用指定的Python（替代npm config set python）
          node-gyp configure --python="$PYTHON"
          # 全局安装node-gyp
          npm install --global node-gyp@latest

      # 步骤3：重新安装依赖（无无效npm配置）
      - name: Install Dependencies
        run: |
          # 强制安装，跳过无效的python配置
          npm install --force --verbose --no-cache
          # 验证ssh2是否安装成功
          if [ -f "node_modules/ssh2/package.json" ]; then
            echo "✅ ssh2 安装成功"
          else
            echo "❌ ssh2 安装失败"
            ls -la node_modules/
            exit 1
          fi

      # 步骤4：重建ssh2（适配Electron）
      - name: Rebuild ssh2 for Electron
        run: |
          npm install --save-dev electron-rebuild
          # 显式指定Python路径给electron-rebuild
          PYTHON=$(which python3.10) npx electron-rebuild -f -m ssh2 --electron-version=28.0.0 --verbose
          # 验证编译结果
          if [ -f "node_modules/ssh2/lib/binding/napi-v6-darwin-x64/ssh2.node" ] || [ -f "node_modules/ssh2/lib/binding/napi-v6-darwin-arm64/ssh2.node" ]; then
            echo "✅ ssh2 编译成功"
          else
            echo "❌ ssh2 编译失败"
            ls -la node_modules/ssh2/lib/binding/
            exit 1
          fi

      # 步骤5：打包macOS应用
      - name: Build macOS App
        run: npm run build:mac --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}
          PYTHON: $(which python3.10) # 传递Python路径到打包环境

      # 步骤6：上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac/
          retention-days: 30