name: Build macOS Electron App (ARM64)
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手动触发优先级最高

# 唯一任务：macOS打包
jobs:
  build-macos:
    # 指定GitHub的macOS Runner（最新版，默认包含arm64/x64环境）
    runs-on: macos-latest
    timeout-minutes: 30  # 避免构建超时（macOS打包稍慢）

    steps:
      # 1. 检出仓库代码（包含完整提交历史）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 可选：如果需要版本号关联提交，建议开启

      # 2. 设置Node.js环境（匹配Electron 39.x兼容的Node版本）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x  # Electron 39.x推荐Node 20.x
          cache: 'npm'  # 缓存npm依赖，大幅加速后续构建

      # 3. 安装项目依赖（适配macOS）
      - name: Install dependencies
        run: npm install
        env:
          # 关键：加速Electron二进制包下载（解决macOS下载慢问题）
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_CUSTOM_DIR: ${{ env.ELECTRON_VERSION }}
          # 适配ssh2的native模块编译（macOS）
          npm_config_build_from_source: true

      # 4. 执行macOS打包命令（对应package.json中的build:mac）
      - name: Build macOS app
        run: npm run build:mac
        env:
          # 传递环境变量，确保打包时使用arm64架构
          ARCH: arm64

      # 5. 验证打包产物（可选：检查dist目录是否有文件）
      - name: Verify build output
        run: |
          ls -la dist/
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "打包产物为空，构建失败！"
            exit 1
          fi

      # 6. 上传macOS打包产物（方便下载）
      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-overleaf-macos-build  # 产物名称，清晰易识别
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.app  # 可选：上传app本体（如果需要）
          if-no-files-found: error  # 无产物则标记构建失败