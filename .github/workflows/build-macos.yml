# 工作流名称
name: Build macOS Electron App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 关键修复1：指定Python 3.9（保留distutils），并安装setuptools补全依赖
      - name: Setup Python 3.9 (with distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # 核心：3.9保留distutils，避免编译报错
          cache: 'pip'

      - name: Install Python Dependencies (setuptools/distutils)
        run: |
          # 安装setuptools（替代distutils，兼容新版Python）
          pip3 install --upgrade setuptools wheel
          # 验证Python版本和distutils是否存在
          python3 --version
          python3 -c "import distutils; print('distutils found')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      # 关键修复2：安装macOS编译依赖（补充openssl，ssh2编译必需）
      - name: Install macOS Build Dependencies
        run: |
          # 确保Xcode命令行工具完整
          if ! xcode-select -p; then
            xcode-select --install || true
          fi
          # 安装ssh2编译依赖的openssl
          brew install openssl@3 || true
          # 配置openssl环境变量，让node-gyp找到库文件
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      # 关键修复3：配置node-gyp使用Python 3.9，避免版本冲突
      - name: Configure node-gyp for Python 3.9
        run: |
          # 全局配置node-gyp的Python路径
          npm config set python $(which python3.9)
          # 安装node-gyp最新版，适配Python 3.9
          npm install --global node-gyp@latest electron-rebuild

      - name: Install Dependencies
        run: |
          npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_VERSION: $(node -p "require('./package.json').devDependencies.electron.replace(/^\^|~/, '')")
          npm_config_build_from_source: true
          # 传递openssl环境变量给npm编译
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL_ROOT_DIR }}

      - name: Rebuild Native Modules (ssh2)
        run: |
          # 重建ssh2，指定Python 3.9和openssl路径
          npx electron-rebuild --force --arch arm64 --module ssh2
          # 验证重建结果
          ls -la node_modules/ssh2/lib/binding/electron-v*/darwin-arm64/ || echo "Binding dir check: skip if not exist"

      - name: Build Electron App for macOS
        run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: arm64
          ELECTRON_VERSION: $(node -p "require('./package.json').devDependencies.electron.replace(/^\^|~/, '')")
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL_ROOT_DIR }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac-arm64/
          retention-days: 30