# 工作流名称
name: Build macOS Electron App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            node_modules/.cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install macOS build tools
        run: |
          xcode-select --install || true
          brew install libusb || true
          # 新增：安装node-gyp依赖（解决原生模块编译）
          npm install -g node-gyp

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Rebuild native modules (ssh2) // 新增：执行手动重建脚本
        run: npm run prebuild
        env:
          # 强制指定架构，避免路径解析错误
          ARCH: arm64
          ELECTRON_VERSION: 39.2.7

      - name: Build macOS App (dmg + zip)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ARCH: arm64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalOverleaf-macOS-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.dmg.blockmap
          retention-days: 15