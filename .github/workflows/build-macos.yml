name: Build macOS Electron App (ARM64 - Final Fix)
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手动触发优先级最高

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      # 全局环境变量 - 所有编译依赖的固定路径 (ARM64专用)
      ARCH: arm64
      OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3
      OPENSSL_LIB_DIR: /opt/homebrew/opt/openssl@3/lib
      OPENSSL_INCLUDE_DIR: /opt/homebrew/opt/openssl@3/include
      PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig
      # 禁用无用提示
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x (ARM64)
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          architecture: arm64
          cache: '' # 彻底禁用缓存，杜绝缓存污染

      # ========== 步骤1：终极修复 Xcode Command Line Tools 路径问题 (核心中的核心) ==========
      - name: Fix Xcode CLT Path & Install (FORCE CORRECT LOCATION)
        run: |
          # 1. 彻底卸载旧的CLT（无论在哪）
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Applications/Xcode.app/Contents/Developer
          # 2. 强制重装CLT到固定路径 /Library/Developer/CommandLineTools (brew强制要求)
          xcode-select --install || true
          # 3. 验证CLT路径是否正确
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
          # 4. 验证CLT是否可用
          gcc --version
          make --version
          echo "✅ Xcode CLT 安装成功，路径正确！"

      # ========== 步骤2：安装Python3.10 + OpenSSL@3 (此时brew安装不会报错) ==========
      - name: Install Python3.10 & OpenSSL@3 (ARM64)
        run: |
          # 更新brew并安装依赖，强制覆盖
          brew update --quiet
          brew install --force --overwrite python@3.10 openssl@3
          # 配置Python3.10全局可用 + 软链接
          export PATH="/opt/homebrew/opt/python@3.10/bin:$PATH"
          sudo ln -sf /opt/homebrew/bin/python3.10 /usr/local/bin/python3
          sudo ln -sf /opt/homebrew/bin/pip3.10 /usr/local/bin/pip3
          # 验证Python安装
          python3 --version
          which python3
          echo "✅ Python3.10 安装成功！"
          # 验证OpenSSL
          openssl version
          which openssl
          echo "✅ OpenSSL@3 安装成功！"

      # ========== 步骤3：安装兼容版node-gyp + 配置环境变量 ==========
      - name: Install node-gyp@9.4.0 (兼容版) + Fix PATH
        run: |
          # 配置npm全局路径
          NPM_GLOBAL=$(npm config get prefix)/bin
          export PATH="$NPM_GLOBAL:/opt/homebrew/opt/python@3.10/bin:$PATH"
          # 卸载高版本，强制安装9.4.0 (唯一适配版本)
          npm uninstall -g node-gyp || true
          npm install -g node-gyp@9.4.0
          # 验证node-gyp
          node-gyp --version
          which node-gyp
          echo "✅ node-gyp@9.4.0 安装成功！"
          # 关键配置：让npm优先使用这个兼容版node-gyp
          npm config set node_gyp "$(npm root -g)/node-gyp/bin/node-gyp.js"

      # ========== 步骤4：清理项目缓存 + 安装依赖 (无任何报错) ==========
      - name: Clean Project & Install Dependencies
        run: |
          # 彻底清理旧依赖
          rm -rf node_modules package-lock.json yarn.lock
          npm cache clean --force
          # 配置全局PATH
          export PATH="$(npm config get prefix)/bin:/opt/homebrew/opt/python@3.10/bin:$PATH"
          # 安装依赖，屏蔽funding提示，强制ARM64架构
          npm install --force --verbose --no-fund --arch=${{ env.ARCH }}
          # 必做：验证ssh2是否完整安装
          if [ -f "node_modules/ssh2/package.json" ]; then
            echo "✅ ssh2 依赖安装成功！路径：node_modules/ssh2"
          else
            echo "❌ ssh2 安装失败！"
            ls -la node_modules/
            exit 1
          fi

      # ========== 步骤5：重建ssh2原生模块 (ARM64适配Electron 28) ==========
      - name: Rebuild ssh2 Native Module (ARM64 + Electron 28)
        run: |
          # 配置所有编译依赖的环境变量
          export PATH="$(npm config get prefix)/bin:/opt/homebrew/opt/python@3.10/bin:$PATH"
          export CC=$(which gcc)
          export CXX=$(which g++)
          # 安装electron-rebuild
          npm install --save-dev electron-rebuild
          # 强制重建ssh2，自动适配所有配置，无手动指定
          npx electron-rebuild -f -m ssh2 --electron-version=28.0.0 --arch=${{ env.ARCH }} --verbose
          # 验证编译结果
          BINDING_FILE="node_modules/ssh2/lib/binding/napi-v6-darwin-${{ env.ARCH }}/ssh2.node"
          if [ -f "$BINDING_FILE" ]; then
            echo "✅ ssh2 原生模块编译成功！二进制文件存在：$BINDING_FILE"
          else
            echo "❌ ssh2 编译失败！"
            ls -la node_modules/ssh2/lib/binding/
            exit 1
          fi

      # ========== 步骤6：打包MacOS ARM64应用 (.app + .dmg) ==========
      - name: Build macOS App (ARM64 - No Sign/Notarize)
        run: |
          export PATH="$(npm config get prefix)/bin:/opt/homebrew/opt/python@3.10/bin:$PATH"
          # 打包命令，跳过签名/公证，纯测试可用，无任何弹窗报错
          npm run build:mac -- --arch=${{ env.ARCH }} --skip-notarization --skip-sign --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_PUBLISH: never
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      # ========== 步骤7：上传打包产物 ==========
      - name: Upload macOS ARM64 Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-ssh2-app
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac/
          retention-days: 30