# 工作流名称
name: Build macOS Electron App

# 触发条件：推送到main分支，或手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动在GitHub页面触发

# 作业配置：在macOS runner上执行
jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30 # 延长超时时间

    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      # 步骤3：安装macOS编译依赖
      - name: Install macOS Build Dependencies
        run: |
          # 确保Xcode命令行工具安装完成（忽略已安装的报错）
          if ! xcode-select -p; then
            xcode-select --install || true
          fi
          # 安装编译原生模块所需的依赖（可选但建议）
          brew install openssl || true

      # 步骤4：安装项目依赖（显式指定Electron版本，避免识别错误）
      - name: Install Dependencies
        run: |
          # 全局安装node-gyp和electron-rebuild（提前安装避免路径问题）
          npm install --global node-gyp electron-rebuild
          # 安装项目依赖，加速Electron下载
          npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # 显式指定Electron版本（从package.json读取，避免自动识别错误）
          ELECTRON_VERSION: $(node -p "require('./package.json').devDependencies.electron.replace(/^\^|~/, '')")
          npm_config_build_from_source: true

      # 步骤5：修复核心错误——正确重建ssh2原生模块
      - name: Rebuild Native Modules (ssh2)
        run: |
          # 正确写法：无需指定-m macos（自动识别平台），仅指定架构arm64
          # --force: 强制重建，--module: 指定要重建的模块为ssh2
          npx electron-rebuild --force --arch arm64 --module ssh2
          # 验证重建结果：检查ssh2的.node文件是否存在
          ls -la node_modules/ssh2/lib/binding/electron-v*/darwin-arm64/

      # 步骤6：打包macOS安装包
      - name: Build Electron App for macOS
        run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: arm64
          # 再次传递Electron版本，确保打包时识别正确
          ELECTRON_VERSION: $(node -p "require('./package.json').devDependencies.electron.replace(/^\^|~/, '')")

      # 步骤7：上传打包产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac-arm64/
          retention-days: 30