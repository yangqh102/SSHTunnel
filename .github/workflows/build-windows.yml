# 工作流名称
name: Build Windows Electron App

# 触发条件：推送到main分支，或手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动在GitHub页面触发

# 作业配置：在Windows runner上执行
jobs:
  build-windows:
    runs-on: windows-latest # 使用GitHub的Windows最新版虚拟机
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装Node.js（匹配项目依赖的版本，这里选18.x，兼容Electron 28）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm' # 缓存npm依赖，加速构建

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            node_modules/.cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 步骤3：安装Windows原生编译工具（解决ssh2原生模块编译）
      - name: Install Windows Build Tools
        uses: ilammy/msvc-dev-cmd@v1 # 配置VS编译环境
      - name: Install Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # node-gyp兼容的Python版本

      # 步骤4：安装项目依赖
      - name: Install Dependencies
        run: |
          npm install --global node-gyp
          npm install # 安装package.json中的依赖

      # 步骤5：重建ssh2原生模块（适配Electron版本）
      - name: Rebuild Native Modules (ssh2)
        run: |
          npm install --save-dev electron-rebuild
          npx electron-rebuild -f -w ssh2 # 仅重建Windows平台的ssh2

      # 步骤6：打包Windows exe（新增env传递GH_TOKEN）
      - name: Build Electron App for Windows
        run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤7：上传打包产物（exe安装包）到GitHub Artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalOverleaf-win-${{ github.sha }} # 产物名称
          path: | # 打包产物路径（匹配electron-builder的output配置）
            dist/*.exe
            dist/win-unpacked/ # 可选：上传免安装版文件夹
          retention-days: 30 # 产物保留30天
